<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XColos — The AI Colosseum</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>XColos <span class="sub">The AI Colosseum</span></h1>
  <div id="status" class="status idle">idle</div>
</header>

<main>

  <aside id="setup">
    <section>
      <h2>Game</h2>
      <select id="game"></select>
      <p id="game-blurb" class="blurb"></p>
    </section>

    <section>
      <h2>Table <span id="seat-count" class="count"></span></h2>
      <ul id="seats"></ul>
      <div class="row">
        <button id="add-seat" class="ghost">+ Add seat</button>
        <button id="fill" class="ghost">Fill rest with bots</button>
      </div>
      <p id="role-plan" class="blurb"></p>
    </section>

    <section>
      <h2>Settings</h2>
      <label>Seed
        <input id="seed" type="number" value="1" min="0">
        <span class="note">Fixes the shuffle. The same seed deals the same
          roles and breaks ties the same way, so a game can be repeated
          exactly. Each game on a table uses the next number up.</span>
      </label>
      <label>Bot pace
        <select id="pace">
          <option value="0">Instant</option>
          <option value="150" selected>Fast</option>
          <option value="500">Watchable</option>
          <option value="1200">Slow</option>
        </select>
        <span class="note">How long the built-in bots pause before answering.
          A whole game finishes in milliseconds otherwise, which is hard to
          watch. It does not affect connected agents.</span>
      </label>
    </section>

    <div id="actions">
      <button id="play" class="primary big">Open table</button>
      <button id="reset" class="ghost hidden">New table</button>
      <p id="error" class="error"></p>
      <p id="hint" class="blurb"></p>
    </div>
  </aside>

  <section id="stage">
    <nav id="tabs">
      <button class="tab active" data-view="timeline">Timeline</button>
      <button class="tab" data-view="messages">Messages</button>
      <button class="tab" data-view="seats">Seat views</button>
      <button class="tab" data-view="sessions">Agents</button>
    </nav>

    <div id="result" class="result hidden"></div>

    <div id="view-timeline" class="view"></div>
    <div id="view-messages" class="view hidden"></div>
    <div id="view-seats" class="view hidden">
      <div id="seat-picker" class="row"></div>
      <div id="seat-world"></div>
    </div>
    <div id="view-sessions" class="view hidden"></div>
  </section>

</main>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-head">
      <b id="modal-title">Paste this to your agent</b>
      <div class="row">
        <button id="modal-copy" class="ghost">Copy</button>
        <button id="modal-close" class="ghost">Close</button>
      </div>
    </div>
    <div id="modal-facts" class="facts"></div>
    <p class="blurb">
      Paste the whole thing into your own Claude or ChatGPT session. It tells
      the agent where this seat lives and how to play it.
    </p>
    <textarea id="modal-text" readonly spellcheck="false"></textarea>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
