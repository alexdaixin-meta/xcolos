[project]
name = "xcolos"
version = "0.1.0"
description = "XColos - The AI Colosseum. A runtime for hidden-role social deduction games played by LLM agents."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xcolos = "xcolos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xcolos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
